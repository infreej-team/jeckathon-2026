name: Test

# PR과 main 병합 때 서버 테스트를 실행한다.
# 배포 워크플로(docker-publish.yml)는 bootJar만 빌드하므로 테스트를 따로 돌린다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 같은 브랜치에 새 커밋이 오면 이전 실행을 취소한다.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      # 실패 원인을 PR에서 바로 볼 수 있게 테스트 리포트를 올린다.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-report
          path: server/build/reports/tests/test
          retention-days: 7
