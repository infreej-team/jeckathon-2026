name: Build and Push Images

# main에 병합되면 client, server, nginx 이미지를 빌드해 GHCR에 push한다.
# 태그는 sha-<7자리 커밋 SHA>를 먼저 붙이고, 모든 서비스 빌드가 성공하면 latest를 붙인다.
# 롤백할 때는 서버 .env.prod의 IMAGE_TAG를 sha 태그로 바꾼다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 연달아 병합되면 이전 빌드를 취소하고 최신 커밋만 빌드한다.
concurrency:
  # 다른 브랜치의 수동 실행이 main 빌드를 취소하지 않도록 브랜치별로 나눈다.
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    # 수동 실행에서 다른 브랜치를 골라도 빌드하지 않는다. 병합 전 코드가 운영 이미지가 되는 것을 막는다.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [client, server, nginx]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 롤백할 때 모든 서비스의 sha 태그가 있어야 하므로, 변경 여부와 상관없이 모두 빌드한다.
      # 아직 Dockerfile이 없는 서비스는 건너뛴다.
      - name: Check Dockerfile
        id: check
        run: |
          if [ -f "${{ matrix.service }}/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${{ matrix.service }}/Dockerfile이 없어 빌드를 건너뛴다."
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.check.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.check.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: type=sha,format=short,prefix=sha-

      - name: Build and push
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # 한쪽 빌드만 성공했을 때 latest가 서로 다른 커밋을 가리키지 않도록, 모두 성공한 뒤에 latest를 옮긴다.
  # 다시 빌드하지 않고 sha 이미지에 latest 태그만 추가한다.
  tag-latest:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Add latest tag
        run: |
          for service in client server nginx; do
            if [ ! -f "$service/Dockerfile" ]; then
              continue
            fi
            image="ghcr.io/${GITHUB_REPOSITORY}/$service"
            docker buildx imagetools create -t "$image:latest" "$image:sha-${GITHUB_SHA::7}"
          done
