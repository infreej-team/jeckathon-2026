name: Build and Deploy

# main에 병합되면 client, server, nginx 이미지를 빌드해 GHCR에 push하고 운영 서버에 반영한다.
# 태그는 sha-<7자리 커밋 SHA>를 먼저 붙이고, 모든 서비스 빌드가 성공하면 latest를 붙인 뒤 배포한다.
# 롤백할 때는 서버 .env.prod의 IMAGE_TAG를 sha 태그로 바꾼다.
# IMAGE_TAG를 sha로 고정해 둔 동안에는 자동 배포가 돌아도 고정한 이미지가 유지된다.
# 단, compose.prod.yaml은 계속 main 최신본으로 덮어쓰므로 compose 변경은 이 방법으로 되돌릴 수 없다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 연달아 병합되면 이전 빌드를 취소하고 최신 커밋만 빌드한다.
concurrency:
  # 다른 브랜치의 수동 실행이 main 빌드를 취소하지 않도록 브랜치별로 나눈다.
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    # 수동 실행에서 다른 브랜치를 골라도 빌드하지 않는다. 병합 전 코드가 운영 이미지가 되는 것을 막는다.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [client, server, nginx]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 롤백할 때 모든 서비스의 sha 태그가 있어야 하므로, 변경 여부와 상관없이 모두 빌드한다.
      # 아직 Dockerfile이 없는 서비스는 건너뛴다.
      - name: Check Dockerfile
        id: check
        run: |
          if [ -f "${{ matrix.service }}/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${{ matrix.service }}/Dockerfile이 없어 빌드를 건너뛴다."
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.check.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.check.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: type=sha,format=short,prefix=sha-

      - name: Build and push
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # 한쪽 빌드만 성공했을 때 latest가 서로 다른 커밋을 가리키지 않도록, 모두 성공한 뒤에 latest를 옮긴다.
  # 다시 빌드하지 않고 sha 이미지에 latest 태그만 추가한다.
  tag-latest:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Add latest tag
        run: |
          for service in client server nginx; do
            if [ ! -f "$service/Dockerfile" ]; then
              continue
            fi
            image="ghcr.io/${GITHUB_REPOSITORY}/$service"
            docker buildx imagetools create -t "$image:latest" "$image:sha-${GITHUB_SHA::7}"
          done

  # 서버에 SSH로 접속해 compose.prod.yaml을 갱신하고 pull과 up -d를 실행한다.
  # 필요한 production 환경 Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_SSH_KNOWN_HOSTS
  deploy:
    needs: tag-latest
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://jeckathon.infreej.dev
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      # SSH 접속 시 홈 디렉터리에서 시작하므로 홈 기준 상대 경로로 둔다.
      DEPLOY_DIR: jeckathon
      COMPOSE: docker compose -f compose.prod.yaml --env-file .env.prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 호스트 키를 Secret으로 고정해, 처음 접속하는 서버를 그대로 신뢰하지 않는다.
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      # 서버의 compose.prod.yaml은 저장소 파일의 복사본이므로 배포할 때마다 덮어쓴다.
      # 임시 파일로 올린 뒤 검증을 통과해야 교체한다. 잘못된 파일로 기존 서비스가 내려가는 것을 막는다.
      - name: Upload compose file
        run: |
          scp compose.prod.yaml server:"$DEPLOY_DIR/compose.prod.yaml.new"
          ssh server "set -e
            cd $DEPLOY_DIR
            docker compose -f compose.prod.yaml.new --env-file .env.prod config -q
            mv compose.prod.yaml.new compose.prod.yaml"

      - name: Pull and restart
        run: |
          ssh server "set -e
            cd $DEPLOY_DIR
            $COMPOSE pull
            $COMPOSE up -d --remove-orphans
            docker image prune -f"

      # Cloudflare를 거친 외부 경로로 확인한다. up -d는 앱 준비를 기다리지 않으므로 최대 3분 동안 다시 시도한다.
      # 응답이 멈춘 요청이 시도 하나를 오래 붙잡지 않도록 요청마다 10초 제한을 둔다.
      - name: Health check
        run: |
          for i in $(seq 1 18); do
            if curl -fsS --max-time 10 -o /dev/null https://jeckathon.infreej.dev/api/health; then
              echo "health check 성공"
              exit 0
            fi
            sleep 10
          done
          echo "::error::/api/health가 3분 동안 200을 반환하지 않았다."
          ssh server "cd $DEPLOY_DIR && $COMPOSE ps"
          exit 1
