x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# 메모리 배분 (4GB 인스턴스): nginx 128m + client 512m + server 1g + db 1g = 약 2.6GB
# 남은 약 1.4GB는 OS, Docker 데몬, 이미지 pull 작업에 쓴다.
services:
  nginx:
    <<: *common
    # 설정 파일은 이미지에 들어 있고, 인증서만 서버에서 마운트한다.
    image: "${NGINX_IMAGE:?NGINX_IMAGE를 .env.prod에 지정해야 한다}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - client
      - server
    mem_limit: 128m

  # 계약: 3000 포트에서 요청을 받고, /api를 제외한 모든 경로를 처리한다.
  client:
    <<: *common
    image: ${CLIENT_IMAGE:-traefik/whoami:latest}
    environment:
      # 임시 이미지(whoami) 설정이다. 실제 이미지로 교체하면 삭제한다.
      WHOAMI_PORT_NUMBER: 3000
      WHOAMI_NAME: client
    mem_limit: 512m

  # 계약: 8080 포트에서 요청을 받고, /api/*를 처리하며, GET /api/health에 200으로 응답한다.
  server:
    <<: *common
    image: ${SERVER_IMAGE:-traefik/whoami:latest}
    # .env.prod 전체를 넣지 않고 server에 필요한 값만 전달한다. 값이 늘어나면 여기에 추가한다.
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-jeckathon}
      DB_USER: ${DB_USER:-jeckathon}
      DB_PASSWORD: "${DB_PASSWORD}"
      # 임시 이미지(whoami) 설정이다. 실제 이미지로 교체하면 삭제한다.
      WHOAMI_PORT_NUMBER: 8080
      WHOAMI_NAME: server
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1g

  db:
    <<: *common
    image: mysql:8.4
    # compose.yaml과 compose.prod.yaml에서 같은 값을 유지한다.
    # Windows에서 마운트한 설정 파일은 권한 문제로 MySQL이 무시하므로 실행 옵션으로 지정한다.
    command:
      - --innodb-buffer-pool-size=256M
      - --max-connections=100
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    environment:
      MYSQL_DATABASE: ${DB_NAME:-jeckathon}
      MYSQL_USER: ${DB_USER:-jeckathon}
      MYSQL_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD를 .env.prod에 지정해야 한다}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD를 .env.prod에 지정해야 한다}"
      TZ: Asia/Seoul
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # 초기화용 임시 서버(소켓 전용)를 정상으로 오판하지 않도록 TCP(127.0.0.1)로 검사한다.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    mem_limit: 1g

volumes:
  db-data:
