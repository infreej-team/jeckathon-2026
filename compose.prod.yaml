x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# 메모리 배분 (4GB 인스턴스): nginx 128m + client 512m + server 1g + db 1g = 약 2.6GB
# 남은 약 1.4GB는 OS, Docker 데몬, 이미지 pull 작업에 쓴다.
services:
  nginx:
    <<: *common
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - client
      - server
    mem_limit: 128m

  # 계약: 3000 포트에서 요청을 받고, /api를 제외한 모든 경로를 처리한다.
  client:
    <<: *common
    image: ${CLIENT_IMAGE:-traefik/whoami:latest}
    environment:
      # 임시 이미지(whoami) 설정이다. 실제 이미지로 교체하면 삭제한다.
      WHOAMI_PORT_NUMBER: 3000
      WHOAMI_NAME: client
    mem_limit: 512m

  # 계약: 8080 포트에서 요청을 받고, /api/*를 처리하며, GET /api/health에 200으로 응답한다.
  server:
    <<: *common
    image: ${SERVER_IMAGE:-traefik/whoami:latest}
    env_file: .env.prod
    environment:
      # 임시 이미지(whoami) 설정이다. 실제 이미지로 교체하면 삭제한다.
      WHOAMI_PORT_NUMBER: 8080
      WHOAMI_NAME: server
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1g

  db:
    <<: *common
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-jeckathon}
      MYSQL_USER: ${DB_USER:-jeckathon}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env.prod에 지정해야 한다}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD를 .env.prod에 지정해야 한다}
      TZ: Asia/Seoul
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # 초기화용 임시 서버(소켓 전용)를 정상으로 오판하지 않도록 TCP(127.0.0.1)로 검사한다.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    mem_limit: 1g

volumes:
  db-data:
