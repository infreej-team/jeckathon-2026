x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# 메모리 배분 (4GB 인스턴스): nginx 128m + client 512m + server 1g + db 1g = 약 2.6GB
# 남은 약 1.4GB는 OS, Docker 데몬, 이미지 pull 작업에 쓴다.
services:
  nginx:
    <<: *common
    # 설정 파일은 이미지에 들어 있고, 인증서만 서버에서 마운트한다.
    image: "${NGINX_IMAGE:?NGINX_IMAGE를 .env.prod에 지정해야 한다}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - client
      - server
    mem_limit: 128m

  # 계약: 3000 포트에서 요청을 받고, /api를 제외한 모든 경로를 처리한다.
  client:
    <<: *common
    image: "${CLIENT_IMAGE:?CLIENT_IMAGE를 .env.prod에 지정해야 한다}"
    mem_limit: 512m

  # 계약: 8080 포트에서 요청을 받고, /api/*를 처리하며, GET /api/health에 200으로 응답한다.
  server:
    <<: *common
    image: "${SERVER_IMAGE:?SERVER_IMAGE를 .env.prod에 지정해야 한다}"
    # .env.prod 전체를 넣지 않고 server에 필요한 값만 전달한다. 값이 늘어나면 여기에 추가한다.
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-jeckathon}
      DB_USER: ${DB_USER:-jeckathon}
      DB_PASSWORD: "${DB_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1g

  db:
    <<: *common
    # 패치 버전까지 고정한다. 움직이는 태그면 새 패치가 나올 때 무관한 배포에서도 db가 재시작된다.
    image: postgres:18.7-alpine
    # compose.yaml과 compose.prod.yaml에서 같은 값을 유지한다.
    command:
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=100
      - -c
      - timezone=Asia/Seoul
    environment:
      POSTGRES_DB: ${DB_NAME:-jeckathon}
      POSTGRES_USER: ${DB_USER:-jeckathon}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD를 .env.prod에 지정해야 한다}"
      TZ: Asia/Seoul
    volumes:
      # PostgreSQL 18 이미지는 데이터를 /var/lib/postgresql/18/docker에 두므로 상위 경로를 마운트한다.
      # MySQL 시절 볼륨(db-data)과 이름을 나눠, 기존 MySQL 데이터 위에서 초기화되지 않게 한다.
      - pg-data:/var/lib/postgresql
    healthcheck:
      # 초기화용 임시 서버(소켓 전용)를 정상으로 오판하지 않도록 TCP(127.0.0.1)로 검사한다.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    mem_limit: 1g

volumes:
  pg-data:
