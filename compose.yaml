# 로컬 개발용 구성이다. DB만 컨테이너로 띄우고 server와 client는 로컬에서 직접 실행한다.
# 운영 구성은 compose.prod.yaml에 있다.
name: jeckathon-dev

services:
  db:
    # 패치 버전까지 고정한다. 움직이는 태그면 새 패치가 나올 때 무관한 배포에서도 db가 재시작된다.
    image: postgres:18.7-alpine
    # compose.yaml과 compose.prod.yaml에서 같은 값을 유지한다.
    command:
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=100
      - -c
      - timezone=Asia/Seoul
    ports:
      # 같은 네트워크의 다른 기기에서 접속하지 못하도록 localhost에만 연다.
      # 5432 포트가 이미 사용 중이면 DB_PORT=5433 docker compose up -d 처럼 바꿔 실행한다.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      # 로컬 전용 DB라서 접속 정보를 고정한다.
      POSTGRES_DB: jeckathon
      POSTGRES_USER: jeckathon
      POSTGRES_PASSWORD: "1234"
      TZ: Asia/Seoul
    volumes:
      # PostgreSQL 18 이미지는 데이터를 /var/lib/postgresql/18/docker에 두므로 상위 경로를 마운트한다.
      - pg-data:/var/lib/postgresql
    healthcheck:
      # 초기화용 임시 서버(소켓 전용)를 정상으로 오판하지 않도록 TCP(127.0.0.1)로 검사한다.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

volumes:
  pg-data:
