# 로컬 개발용 구성이다. DB만 컨테이너로 띄우고 server와 client는 로컬에서 직접 실행한다.
# 운영 구성은 compose.prod.yaml에 있다.
name: jeckathon-dev

services:
  db:
    # 패치 버전까지 고정한다. 움직이는 태그면 새 패치가 나올 때 무관한 배포에서도 db가 재시작된다.
    image: mysql:8.4.13
    # compose.yaml과 compose.prod.yaml에서 같은 값을 유지한다.
    # Windows에서 마운트한 설정 파일은 권한 문제로 MySQL이 무시하므로 실행 옵션으로 지정한다.
    command:
      - --innodb-buffer-pool-size=256M
      - --max-connections=100
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    ports:
      # 같은 네트워크의 다른 기기에서 접속하지 못하도록 localhost에만 연다.
      # 3306 포트가 이미 사용 중이면 DB_PORT=3307 docker compose up -d 처럼 바꿔 실행한다.
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    environment:
      # 로컬 전용 DB라서 접속 정보를 고정한다.
      MYSQL_DATABASE: jeckathon
      MYSQL_USER: jeckathon
      MYSQL_PASSWORD: "1234"
      MYSQL_ROOT_PASSWORD: "root"
      TZ: Asia/Seoul
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # 초기화용 임시 서버(소켓 전용)를 정상으로 오판하지 않도록 TCP(127.0.0.1)로 검사한다.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

volumes:
  db-data:
