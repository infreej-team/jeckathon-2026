# 재배포로 컨테이너 IP가 바뀌어도 반영되도록 Docker DNS로 주기적으로 다시 조회한다.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cloudflare Tunnel 뒤에서 실제 방문자 IP를 복원한다.
# 요청은 호스트의 cloudflared가 루프백 포트로 보내고, Docker를 거치면서 출발지가 Docker 게이트웨이 주소가 된다.
# 그래서 Docker 기본 주소 대역을 신뢰한다. nginx 포트는 루프백에만 열려 있어 외부에서는 직접 접근할 수 없다.
real_ip_header CF-Connecting-IP;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;

# HTTP는 프록시하지 않고 HTTPS로 리다이렉트만 한다.
server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Cloudflare Origin CA 인증서 (서버의 nginx/certs에 둔다)
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 이 블록은 HTTPS로만 받으므로 $scheme은 항상 https다.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location /api/ {
        set $server_upstream http://server:8080;
        proxy_pass $server_upstream;
    }

    location / {
        set $client_upstream http://client:3000;
        proxy_pass $client_upstream;
    }
}
